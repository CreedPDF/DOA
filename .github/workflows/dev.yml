name: Dev check

on:
  push:
    branches: ['dev-**']

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew compileJava compileClientJava --stacktrace 2>&1 | tee gradle-build.log
      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "error:|What went wrong" -A3 gradle-build.log | head -n 120 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Compile::$msg"

  blender:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-4.2.0-linux-x64
      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSL "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz" | tar -xJ -C ~/blender --strip-components=1
      - name: Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null
      - name: Build models in Blender
        id: blender
        run: |
          set -o pipefail
          tools/blender/build.sh ~/blender/blender 2>&1 | tee blender.log
      - name: Report Blender errors
        if: failure() && steps.blender.outcome == 'failure'
        run: |
          msg=$(grep -v '^Fra:' blender.log | grep -E -B2 -A12 'Traceback|Error|error:|Exception' | tail -n 80 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Blender::$msg"
      - name: Validate assets
        run: python3 tools/validate_assets.py
      - name: Commit generated assets to the dev branch
        run: |
          mkdir -p docs/renders
          cp build/blender/*.png docs/renders/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/doa docs/renders
          if git diff --cached --quiet; then echo "unchanged"; else
            git commit -m "Dev: Blender assets [skip ci]"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
            git push || true
          fi
