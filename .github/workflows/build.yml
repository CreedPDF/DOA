name: Build

on:
  push:
    branches-ignore: ['dev-**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  BLENDER_VERSION: '4.2.0'
  BLENDER_SERIES: '4.2'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------ Blender (headless) models
      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSL "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null

      - name: Build models in Blender
        id: blender
        run: |
          set -o pipefail
          tools/blender/build.sh ~/blender/blender 2>&1 | tee blender.log

      - name: Report Blender errors
        if: failure() && steps.blender.outcome == 'failure'
        run: |
          msg=$(grep -v '^Fra:' blender.log | grep -E -B2 -A12 'Traceback|Error|error:|Exception' | tail -n 80 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Blender::$msg"

      - name: Validate assets
        run: python3 tools/validate_assets.py

      - name: Commit Blender-generated assets
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p docs/renders
          cp build/blender/*.png docs/renders/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/doa docs/renders
          if git diff --cached --quiet; then echo "Assets unchanged"; else
            git commit -m "Regenerate models from Blender [skip ci]"
            git pull --rebase -X theirs origin main || true
            git push || echo "::warning::could not push regenerated assets"
          fi

      # ------------------------------------------------------------ mod jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod jar
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee gradle-build.log

      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "error:|warning: \[|FAILED|What went wrong" -A3 gradle-build.log | head -n 80 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle build::$msg"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: doa-jar
          path: build/libs/*.jar

      - name: Read mod version
        id: ver
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DOA ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: build/libs/doa-${{ steps.ver.outputs.version }}.jar
